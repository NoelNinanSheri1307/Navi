<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 150" width="100%" height="100%">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <g transform="translate(10, 15)">
    <path d="M 20 110 C 20 60, 50 30, 90 20 C 70 50, 60 80, 70 110" fill="url(#primaryGrad)" opacity="0.8" />
    <path d="M 55 110 C 72 70, 98 45, 115 15 L 123 31 C 105 60, 82 85, 75 110" fill="url(#glowGrad)" filter="url(#neonGlow)" />
    <circle cx="90" cy="20" r="7" fill="#ffffff" filter="url(#neonGlow)" />
  </g>

  <g transform="translate(160, 95)" font-family="system-ui, -apple-system, sans-serif" font-weight="700">
    <text x="0" y="0" font-size="72" fill="#ffffff" letter-spacing="4">NAVI</text>
    <text x="5" y="24" font-size="12" fill="#6b7280" font-family="monospace" letter-spacing="5" font-weight="400">TRAFFIC INTELLIGENCE</text>
  </g>
</svg>
